<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safety Pomodoro — Best Practice</title>
  <meta name="description" content="Профессиональный Pomodoro-таймер с советами по безопасности от Best Practice AI">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-490420702"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-490420702');
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone для JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =====================
       BEST PRACTICE BRAND
       ===================== */
    :root {
      --bp-gold:        #D4A017;
      --bp-gold-light:  #E8C04A;
      --bp-gold-dark:   #A07810;
      --bp-navy:        #0f1c2e;
      --bp-navy-light:  #1b2b45;
      --bp-navy-mid:    #243656;
      --bp-steel:       #2d4a6e;
      --bp-text:        #f0f4f8;
      --bp-text-muted:  #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bp-navy) 0%, var(--bp-navy-light) 60%, var(--bp-navy-mid) 100%);
      min-height: 100vh;
      color: var(--bp-text);
    }

    /* --- Glass cards --- */
    .glass {
      background: rgba(15, 28, 46, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(212, 160, 23, 0.18);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    .glass-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-hover:hover {
      background: rgba(15, 28, 46, 0.8);
      border-color: rgba(212, 160, 23, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }

    /* --- Gold hazard stripe --- */
    .hazard-stripe {
      background: repeating-linear-gradient(
        45deg,
        var(--bp-gold),
        var(--bp-gold) 10px,
        var(--bp-navy) 10px,
        var(--bp-navy) 20px
      );
    }

    /* --- Neo-button (dark) --- */
    .neo-button {
      background: linear-gradient(145deg, var(--bp-navy-mid), var(--bp-steel));
      box-shadow: 4px 4px 10px #060e1a, -4px -4px 10px #2a3d5c;
      color: var(--bp-text);
      transition: all 0.3s ease;
    }
    .neo-button:hover {
      box-shadow: 2px 2px 5px #060e1a, -2px -2px 5px #2a3d5c;
    }
    .neo-button:active {
      box-shadow: inset 2px 2px 5px #060e1a, inset -2px -2px 5px #2a3d5c;
    }

    /* --- Gradient border button --- */
    @property --animate-duration {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    @keyframes rotate-gradient {
      0%   { --animate-duration: 0deg; }
      100% { --animate-duration: 360deg; }
    }
    .gradient-border-btn:after,
    .gradient-border-btn:before {
      content: '';
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 16px;
      background-image: conic-gradient(
        from var(--animate-duration) at 50% 50%,
        var(--bp-gold) 0%,
        #3b82f6 25%,
        #8b5cf6 50%,
        var(--bp-gold-light) 75%,
        var(--bp-gold) 100%
      );
      animation: rotate-gradient 3s infinite linear;
      z-index: -1;
    }
    .gradient-border-btn:before {
      filter: blur(8px);
      opacity: 0.7;
    }

    /* --- Progress ring --- */
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring__circle {
      transition: stroke-dashoffset 0.35s;
      transform-origin: 50% 50%;
    }

    /* --- Анимации --- */
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slide-in 0.5s ease-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out; }

    @keyframes pulse-safety {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.05); opacity: 0.9; }
    }
    .safety-pulse { animation: pulse-safety 2s ease-in-out infinite; }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 5px rgba(212,160,23,0.5); }
      50%       { box-shadow: 0 0 20px rgba(212,160,23,0.9); }
    }
    .animate-pulse { animation: pulse-glow 2s ease-in-out infinite; }

    @keyframes shimmer {
      0%   { background-position: -1000px 0; }
      100% { background-position:  1000px 0; }
    }
    .shimmer {
      animation: shimmer 2s infinite linear;
      background: linear-gradient(to right, #1b2b45 4%, #243656 25%, #1b2b45 36%);
      background-size: 1000px 100%;
    }

    /* --- 3D Card --- */
    .card-3d {
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }
    .card-3d:hover { transform: translateY(-4px) rotateX(2deg); }

    /* --- Enhanced button --- */
    .enhanced-button {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .enhanced-button::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.5s;
    }
    .enhanced-button:hover::before { left: 100%; }

    /* --- Ripple --- */
    @keyframes ripple-effect {
      0%   { transform: scale(1);  opacity: 1; }
      50%  { transform: scale(10); opacity: 0.3; }
      100% { transform: scale(35); opacity: 0; }
    }

    /* --- Custom scrollbar --- */
    ::-webkit-scrollbar       { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bp-navy); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--bp-gold-dark); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--bp-gold); }

    /* --- Range input --- */
    input[type=range] { accent-color: var(--bp-gold); }

    /* --- Gold text utility --- */
    .text-bp-gold  { color: var(--bp-gold); }
    .text-bp-light { color: var(--bp-text); }
    .bg-bp-navy    { background-color: var(--bp-navy-mid); }

    /* --- Footer link --- */
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--bp-text-muted);
      font-size: 0.8rem;
      transition: color 0.2s;
    }
    .footer-brand:hover { color: var(--bp-gold); }

    /* --- Stat card dark variants --- */
    .stat-blue   { background: rgba(59,130,246,0.12);  border: 1px solid rgba(59,130,246,0.2); }
    .stat-green  { background: rgba(16,185,129,0.12);  border: 1px solid rgba(16,185,129,0.2); }
    .stat-purple { background: rgba(139,92,246,0.12);  border: 1px solid rgba(139,92,246,0.2); }
    .stat-gold   { background: rgba(212,160,23,0.12);  border: 1px solid rgba(212,160,23,0.2); }

    /* --- Calendar day --- */
    .cal-day:hover { background: rgba(212,160,23,0.15); }
    .cal-today {
      background: linear-gradient(135deg, var(--bp-gold), #E8C04A) !important;
      color: var(--bp-navy) !important;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Основное React приложение -->
  <script type="text/babel" data-presets="env,react" src="app.jsx?v=12"></script>
</body>
</html>
